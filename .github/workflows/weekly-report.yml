# Weekly report for this business (Claude Code + Sysdig MCP). The logic lives in yoshiki-doi/demo-ci.
# Needs these repository secrets:
#   ANTHROPIC_API_KEY         Claude API key
#   SYSDIG_SECURE_API_TOKEN   API key of this business's team service account (sees only its own zones)
#   SLACK_WEBHOOK_URL         optional: Incoming Webhook of this business's Slack channel
name: weekly-report

on:
  schedule:
    - cron: "0 0 * * 1"   # Monday 09:00 JST
  workflow_dispatch:

jobs:
  report:
    permissions:
      contents: read
      actions: read
      security-events: read
    uses: yoshiki-doi/demo-ci/.github/workflows/weekly-report.yml@main
    with:
      biz: b
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SYSDIG_SECURE_API_TOKEN: ${{ secrets.SYSDIG_SECURE_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
